spring:
  application:
    name: consolida-iag

  datasource:
    url: jdbc:postgresql://localhost:5432/consolida_iag_db
    username: postgres
    password: postgres_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect